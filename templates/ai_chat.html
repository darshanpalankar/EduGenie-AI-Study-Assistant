<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGenie AI</title>

  <link rel="icon" href="{{ url_for('static', filename='images/edugenie_ai_favicon.png') }}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='/css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='/css/chat.css') }}">
</head>

<body class="chat-page">

  <header class="app-header">
    <div class="brand">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo" class="brand-logo">
      <div class="brand-text">
        <h1>Edu<span class="brand-genie">Genie</span></h1>
        <p>Your personal AI Study Assistant</p>
      </div>
    </div>
    <button class="reset-btn" id="resetBtn" title="Start a new conversation">New chat</button>
  </header>

  <main class="chat-shell">
    <div class="messages" id="messages">
      <div class="msg bot" id="greetMsg">
        <div class="greet">
          <div class="mark" aria-hidden="true">
            <!-- <video muted playsinline width="220">
              <source src="static/images/ai_robot_animated.webm" type="video/webm">
              Your browser does not support the video tag.
            </video> -->
            <img src="{{ url_for('static', filename='images/home_robot.png') }}" alt="" class="mark-img">
          </div>
          <h1>Hey, Welcome back.</h1>
          <p>Ask me anything &mdash; from tricky concepts to quick explanations.</p>
          <div class="suggestions">
            <button type="button" class="suggestion-chip" data-prompt="Explain API in simple terms">Explain API</button>
            <button type="button" class="suggestion-chip" data-prompt="Give me 5 tips to study more effectively">Study
              tips</button>
            <button type="button" class="suggestion-chip"
              data-prompt="What's the difference between a stack and a queue?">Stack vs queue</button>
          </div>
        </div>
      </div>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="attachments" id="attachments" hidden></div>
      <div class="composer-row">
        <div class="attach-wrap">
          <button type="button" class="composer-icon-btn attach-btn" id="attachBtn" aria-label="Add files or photos"
            aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <div class="attach-menu" id="attachMenu" role="menu" hidden>
            <button type="button" class="attach-menu-item" id="attachFilesBtn" role="menuitem">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>Add files or photos</span>
            </button>
          </div>
        </div>

        <input type="file" id="fileInput" multiple hidden
          accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain,text/markdown,text/csv,application/json,.py,.js,.jsx,.ts,.tsx,.java,.c,.cpp,.h,.cs,.go,.rs,.rb,.php,.html,.css,.sql,.yml,.yaml,.log" />

        <textarea id="userInput" placeholder="Ask EduGenie anything..." aria-label="Message" rows="1"></textarea>
        <button type="submit" class="composer-icon-btn send-btn" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="50" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </form>
    <p class="composer-hint">EduGenie can make mistakes. Verify important information.</p>
  </main>

  <!-- marked: renders markdown (bold, bullet points, numbered lists, etc.) to HTML -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <!-- DOMPurify: sanitizes the HTML produced by marked before it's inserted into the page -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <!-- highlight.js: adds syntax colors to fenced code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script src="{{ url_for('static', filename='/js/base.js') }}"></script>
  <script src="{{ url_for('static', filename='/js/chat.js') }}"></script>
</body>

</html>
